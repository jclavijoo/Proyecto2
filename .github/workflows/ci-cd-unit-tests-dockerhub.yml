# Basado en Niveles/3/CICD/github_actions/templates/ci-cd-unit-tests-dockerhub.yml
#
# - push o pull_request con cambios en la API, en las pruebas (tests/) o en el
#   features.py de Airflow: corre las pruebas, directamente y dentro de un contenedor.
# - Solo en push a main y si las pruebas pasaron: publica la imagen de la API.
#
# Secrets requeridos (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
name: CI Unit Tests + DockerHub Publish

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "api/**"
      - "tests/**"
      - "pytest.ini"
      - "requirements-test.txt"
      - "Dockerfile.test"
      - "airflow/dags/diabetes_pipeline/features.py"
      - ".github/workflows/ci-cd-unit-tests-dockerhub.yml"
  pull_request:
    branches:
      - main
    paths:
      - "api/**"
      - "tests/**"
      - "pytest.ini"
      - "requirements-test.txt"
      - "Dockerfile.test"
      - "airflow/dags/diabetes_pipeline/features.py"
      - ".github/workflows/ci-cd-unit-tests-dockerhub.yml"

env:
  PYTHON_VERSION: "3.12"
  APP_PATH: "api"
  IMAGE_NAME: "jclavijoo/mlops-p2-api"

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r $APP_PATH/requirements.txt -r requirements-test.txt

      - name: Run unit tests
        run: pytest -v

      - name: Run unit tests in container
        run: |
          docker build -f Dockerfile.test -t mlops-p2-tests .
          docker run --rm mlops-p2-tests

  publish-dockerhub:
    needs: unit-tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_PATH }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
