# Basado en Niveles/3/CICD/github_actions/templates/ci-cd-unit-tests-dockerhub.yml
# Secrets del repositorio: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
name: CI Unit Tests + DockerHub Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run unit tests
        run: pytest -q tests/

  publish-dockerhub:
    needs: unit-tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        image: [airflow, mlflow, api, streamlit, locust]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mlops-p2-${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mlops-p2-${{ matrix.image }}:${{ github.sha }}
