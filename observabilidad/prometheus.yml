# Configuración para docker compose (en Kubernetes se usa prometheus-k8s.yml)
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: inference-api
    static_configs:
      - targets: ['api:8000']
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']
