# Servidor MLflow:
#   backend store  -> PostgreSQL (postgres-mlflow)   [no SQLite]
#   artifact store -> MinIO (s3://mlflow-artifacts)
# Con --serve-artifacts el servidor actúa como proxy de artefactos: Airflow y la
# API solo necesitan MLFLOW_TRACKING_URI; las credenciales de MinIO viven
# únicamente en este pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels:
    app: mlflow
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      initContainers:
      - name: ensure-bucket
        image: jclavijoo/mlops-p2-mlflow:0.1.0
        command:
        - python
        - /app/ensure_bucket.py
        envFrom:
        - configMapRef:
            name: mlflow-config
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: MINIO_ROOT_USER
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: MINIO_ROOT_PASSWORD
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
      containers:
      - name: mlflow
        image: jclavijoo/mlops-p2-mlflow:0.1.0
        command:
        - sh
        - -c
        args:
        - exec mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri "postgresql+psycopg2://${MLFLOW_DB_USER}:${MLFLOW_DB_PASSWORD}@${MLFLOW_DB_HOST}:${MLFLOW_DB_PORT}/${MLFLOW_DB_NAME}"
          --artifacts-destination "s3://${MLFLOW_ARTIFACTS_BUCKET}" --serve-artifacts --workers "${MLFLOW_WORKERS}" --gunicorn-opts
          "--timeout 180"
        ports:
        - name: http
          containerPort: 5000
        envFrom:
        - configMapRef:
            name: mlflow-config
        env:
        - name: MLFLOW_DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-mlflow-secret
              key: POSTGRES_USER
        - name: MLFLOW_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-mlflow-secret
              key: POSTGRES_PASSWORD
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: MINIO_ROOT_USER
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: MINIO_ROOT_PASSWORD
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1536Mi
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
          failureThreshold: 5
