# GENERADO a partir de archivos del repositorio. Si los modifica, regenere con:
#   kubectl create configmap grafana-dashboard-providers -n mlops --from-file=observabilidad/grafana/provisioning/dashboards/ --dry-run=client -o yaml > k8s/grafana-dashboard-providers-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  namespace: mlops
data:
  dashboard.yml: |
    apiVersion: 1
    providers:
      - name: mlops
        orgId: 1
        folder: MLOps
        type: file
        disableDeletion: false
        allowUiUpdates: true
        options:
          path: /etc/grafana/dashboards
