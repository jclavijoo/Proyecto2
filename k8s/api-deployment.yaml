apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-api
  labels:
    app: inference-api
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-api
  template:
    metadata:
      labels:
        app: inference-api
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8000'
        prometheus.io/path: /metrics
    spec:
      containers:
      - name: inference-api
        image: joshin290/mlops-p2-api:0.1.0
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: inference-api-config
        env:
        - name: DATA_DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-data-secret
              key: API_DB_USER
        - name: DATA_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-data-secret
              key: API_DB_PASSWORD
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 5
