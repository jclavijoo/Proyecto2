# Credenciales del proyecto. CAMBIE LAS CONTRASEÑAS antes de aplicar (solo letras y números:
# se usan dentro de URIs de conexión). stringData se escribe en texto plano y Kubernetes
# lo guarda en base64. Deben coincidir con el archivo .env de docker-compose.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-data-secret
  namespace: mlops
type: Opaque
stringData:
  POSTGRES_USER: mlops
  POSTGRES_PASSWORD: CambieEstaClave123
  API_DB_USER: api_writer
  API_DB_PASSWORD: CambieEstaClaveApi123

