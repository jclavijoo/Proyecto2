apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  labels:
    app: grafana
  namespace: mlops
data:
  GF_USERS_ALLOW_SIGN_UP: 'false'
  GF_AUTH_ANONYMOUS_ENABLED: 'false'
  GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/mlops-inference-api.json
  GF_ANALYTICS_REPORTING_ENABLED: 'false'
